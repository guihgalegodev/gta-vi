<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Theft Auto VI</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
</head>

<body>

  <p class="nome">Lucia</p>
  <img class="personagem" src="img/lucia.png" alt="">

  <div class="textos">
    <p class="etiqueta">Selecione seu personagem</p>
    <h1>Não é só <br> um Jogo</h1>
    <p class="texto-apoio">Escolhas uma lenda de Dev City. Ou tire uma selfie e vire uma.</p>
  </div>

  <div class="menu">
    <img class="avatar" data-btn="Lucia" src="img/lucia.png" alt="">
    <img class="avatar" data-btn="Jason" src="img/jason.png" alt="">
    <img class="avatar" data-btn="Cj" src="img/cj.png" alt="">
    <button class="voce">📷</button>
  </div>

  <script type="module" src="./js/script.js"></script>

</html>
